<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Site web personnel d'Etienne Hoarau" />

    <title>Etienne Hoarau</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="css/copy.css" />
  </head>

  <body>
    <input type="radio" name="nav" id="nav-accueil" class="nav-radio" checked />

    <input type="radio" name="nav" id="nav-experiences" class="nav-radio" />

    <input type="radio" name="nav" id="nav-projets" class="nav-radio" />

    <header></header>

    <nav class="carousel-nav">
      <div class="title">
        <h1>Etienne Hoarau</h1>

        <img data-profile="photo_url" alt="Ma photo" />
      </div>

      <div class="carousel-list-div">
        <img
          src="assets/nav_bouton/L_btn.png"
          alt="Bouton gauche"
          class="gamepad_btn"
        />

        <ul class="carousel-list">
          <li class="carousel-item">
            <label for="nav-accueil"> Acceuil </label>
          </li>

          <li class="carousel-item">
            <label for="nav-experiences"> Expériences </label>
          </li>

          <li class="carousel-item">
            <label for="nav-projets"> Projets </label>
          </li>
        </ul>

        <img
          src="assets/nav_bouton/R_btn.png"
          alt="Bouton droit"
          class="gamepad_btn"
        />
      </div>
    </nav>

    <main>
      <section id="accueil" class="content-section">
        <h2>Bienvenue</h2>

        <div class="profile">
          <div>
            <img data-profile="photo_url" alt="Photo de profil" />
          </div>

          <div>
            <h3 data-profile="name"></h3>

            <p id="Titre" data-profile="title"></p>

            <p data-profile="description"></p>
          </div>
        </div>

        <h2>Contact</h2>

        <div class="contact" id="contact-links"></div>
      </section>

      <section id="experiences" class="content-section">
        <h2>Expériences</h2>

        <p>En cours</p>
      </section>

      <section id="projets" class="content-section">
        <h2>Projets</h2>

        <div class="project-list"></div>

        <div class="projects">
          <div class="projects-list">
            <div class="filter">
              <button class="filter-button" type="button">Filtres</button>

              <div class="filter-options" aria-hidden="true"></div>
            </div>
          </div>

          <div class="project-description"></div>
        </div>
      </section>

      <section id="contact" class="content-section">
        <h2>Contact</h2>

        <p>
          N'hésitez pas à me contacter pour toute question, proposition ou
          collaboration.
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Etienne Hoarau</p>
    </footer>

    <script src="js/copy.js"></script>
    <script src="js/supabase.js"></script>
  </body>
</html>
